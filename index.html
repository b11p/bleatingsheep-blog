tton class="vp-switch vp-switch-appearance" type="button" role="switch" aria-checked="false" title data-v-b6926b42 data-v-deff1a14 data-v-243f89ce><span class="check" data-v-243f89ce><span class="icon" data-v-243f89ce><!--[--><span class="vpi-sun sun" data-v-deff1a14></span><span class="vpi-moon moon" data-v-deff1a14></span><!--]--></span></span></button></div></div></div><!----><!--]--><!--]--></div></div></div><!--[--><!--]--><button type="button" class="vp-navbar-hamburger hamburger" aria-label="mobile navigation" aria-expanded="false" aria-controls="nav-screen" data-v-84e02ed1 data-v-f00b45b2><span class="container" data-v-f00b45b2><span class="top" data-v-f00b45b2></span><span class="middle" data-v-f00b45b2></span><span class="bottom" data-v-f00b45b2></span></span></button></div></div></div></div><div class="divider" data-v-84e02ed1><div class="divider-line" data-v-84e02ed1></div></div></div><!----></header><!----><!--[--><!----><!----><!--]--><!--[--><div id="VPContent" vp-content class="vp-content" data-v-3835cfce data-v-1136ebd8><div class="vp-posts" vp-posts data-v-1136ebd8 data-v-6699890f><!--[--><!--[--><!--]--><div class="posts-container" data-v-6699890f><!----><div class="vp-post-list" data-v-6699890f data-v-ea564199><!--[--><!--]--><!--[--><template><div class="vp-post-item" data-allow-mismatch data-v-ea564199 data-v-821a1f7d><!----><div class="post-item-content" data-v-821a1f7d><h3 data-v-821a1f7d><!----><!----><!----><a class="vp-link link" href="/2026/01/31/%E5%9C%A8-Fedora-41-%E4%B8%8A%E4%BD%BF%E7%94%A8-nmcli-%E5%88%9B%E5%BB%BA-IPv6-%E9%9A%A7%E9%81%93%E7%9A%84%E6%B3%A8%E6%84%8F%E4%BA%8B%E9%A1%B9/" data-v-821a1f7d><!--[-->在 Fedora 41+ 上使用 nmcli 创建 IPv6 隧道的注意事项<!--]--><!--[--><!--]--><!----></a></h3><div class="post-meta" data-v-821a1f7d><!----><div class="reading-time" data-v-821a1f7d><span class="vpi-books icon" data-v-821a1f7d></span><span data-v-821a1f7d>约 210 字</span><span data-v-821a1f7d>1 分钟</span></div><!----><div class="create-time" data-v-821a1f7d><span class="icon vpi-clock" data-v-821a1f7d></span><span data-v-821a1f7d>2026-01-31</span></div></div><div class="vp-doc excerpt" data-v-821a1f7d><p>我之前一直使用 <a href="https://tunnelbroker.net/" target="_blank" rel="noopener noreferrer">Hurricane Electric</a> 的 IPv6 隧道服务为我的 VPS 添加 IPv6 支持。<a href="https://fedoraproject.org/wiki/IPv6_tunnel_via_Hurricane_Electric" target="_blank" rel="noopener noreferrer">Fedora Wiki</a> 有具体命令。但是，自从 Fedora 41（也许是 40，记不清具体时间了）升级以来，此方法失效了，创建的隧道一直无法启用。</p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-ea564199 data-v-821a1f7d><!----><div class="post-item-content" data-v-821a1f7d><h3 data-v-821a1f7d><!----><!----><!----><a class="vp-link link" href="/2026/01/03/PVE-%E9%9D%9E%E7%89%B9%E6%9D%83%E5%AE%B9%E5%99%A8-CT-%E6%97%A0%E6%B3%95%E4%BD%BF%E7%94%A8-Docker-%E7%9A%84%E4%B8%B4%E6%97%B6%E8%A7%A3%E5%86%B3%E6%96%B9%E6%A1%88/" data-v-821a1f7d><!--[-->PVE 非特权容器 (CT) 无法使用 Docker 的临时解决方案<!--]--><!--[--><!--]--><!----></a></h3><div class="post-meta" data-v-821a1f7d><!----><div class="reading-time" data-v-821a1f7d><span class="vpi-books icon" data-v-821a1f7d></span><span data-v-821a1f7d>约 375 字</span><span data-v-821a1f7d>1 分钟</span></div><!----><div class="create-time" data-v-821a1f7d><span class="icon vpi-clock" data-v-821a1f7d></span><span data-v-821a1f7d>2026-01-03</span></div></div><div class="vp-doc excerpt" data-v-821a1f7d><p>我之前在自己的几台机器上装了 Proxmox VE (PVE)，并给日日开了个容器 (CT)，让他跑一些自己的东西。日日在容器中装了 Docker，之前一直跑得好好的。2024 年 11 月，日日告诉我，他的几个服务 down 了，并且 Docker 容器打不开。</p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-ea564199 data-v-821a1f7d><!----><div class="post-item-content" data-v-821a1f7d><h3 data-v-821a1f7d><!----><!----><!----><a class="vp-link link" href="/2024/03/05/%E6%88%91%E6%83%B3%E5%BB%BA%E7%AB%8B%E4%B8%AA%E4%BA%BA-wiki/" data-v-821a1f7d><!--[-->我想建立个人 wiki<!--]--><!--[--><!--]--><!----></a></h3><div class="post-meta" data-v-821a1f7d><!----><div class="reading-time" data-v-821a1f7d><span class="vpi-books icon" data-v-821a1f7d></span><span data-v-821a1f7d>约 1905 字</span><span data-v-821a1f7d>6 分钟</span></div><!----><div class="create-time" data-v-821a1f7d><span class="icon vpi-clock" data-v-821a1f7d></span><span data-v-821a1f7d>2024-03-05</span></div></div><div class="vp-doc excerpt" data-v-821a1f7d><p>我建立这个博客的初衷是记录一些网络上可能没有直接记载的信息，而不知道这些信息在某些时候可能会导致踩坑，或者要绕很多弯路才能找到最佳实践。所以，我的博客内容很少是单纯的内容整合，而是针对具体的问题提出网络上暂时不存在的解决方法或者讨论。但是，近来我发现，博客似乎无法很好地实现这个目标……</p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-ea564199 data-v-821a1f7d><!----><div class="post-item-content" data-v-821a1f7d><h3 data-v-821a1f7d><!----><!----><!----><a class="vp-link link" href="/2024/02/19/CPP%E7%9A%84%E7%A5%9E%E5%A5%87%E8%BF%90%E7%AE%97/" data-v-821a1f7d><!--[-->C++ 的神奇运算<!--]--><!--[--><!--]--><!----></a></h3><div class="post-meta" data-v-821a1f7d><!----><div class="reading-time" data-v-821a1f7d><span class="vpi-books icon" data-v-821a1f7d></span><span data-v-821a1f7d>约 1296 字</span><span data-v-821a1f7d>4 分钟</span></div><div class="tag-list" data-v-821a1f7d><span class="icon vpi-tag" data-v-821a1f7d></span><!--[--><a class="vp-link link tag vp-tag-wffc" href="/tags/?tag=C++" data-v-821a1f7d><!--[-->C++<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-wdj4" href="/tags/?tag=GCC" data-v-821a1f7d><!--[-->GCC<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-tybt" href="/tags/?tag=编译器" data-v-821a1f7d><!--[-->编译器<!--]--><!--[--><!--]--><!----></a><!--]--></div><div class="create-time" data-v-821a1f7d><span class="icon vpi-clock" data-v-821a1f7d></span><span data-v-821a1f7d>2024-02-19</span></div></div><div class="vp-doc excerpt" data-v-821a1f7d><p>最近同学问我，为什么他的程序跑的结果不符合预期，甚至跑出了非常离谱的结果，于是我们进行了一番调查。</p>
<p>简化后的程序如下所示：</p>
<div class="language-cpp line-numbers-mode" data-highlighter="shiki" data-ext="cpp" style="--shiki-light:#393a34;--shiki-dark:#dbd7caee;--shiki-light-bg:#ffffff;--shiki-dark-bg:#121212"><pre class="shiki shiki-themes vitesse-light vitesse-dark vp-code" v-pre=""><code class="language-cpp"><span class="line"><span style="--shiki-light:#AB5959;--shiki-dark:#CB7676">int</span><span style="--shiki-light:#393A34;--shiki-dark:#DBD7CAEE"> a </span><span style="--shiki-light:#999999;--shiki-dark:#666666">=</span><span style="--shiki-light:#2F798A;--shiki-dark:#4C9A91"> 2</span><span style="--shiki-light:#999999;--shiki-dark:#666666">;</span></span>
<span class="line"><span style="--shiki-light:#AB5959;--shiki-dark:#CB7676">int</span><span style="--shiki-light:#59873A;--shiki-dark:#80A665"> func</span><span style="--shiki-light:#999999;--shiki-dark:#666666">()</span></span>
<span class="line"><span style="--shiki-light:#999999;--shiki-dark:#666666">{</span></span>

<span class="line"><span style="--shiki-light:#999999;--shiki-dark:#666666">    {</span></span>
<span class="line"><span style="--shiki-light:#59873A;--shiki-dark:#80A665">        printf</span><span style="--shiki-light:#999999;--shiki-dark:#666666">(</span><span style="--shiki-light:#B5695977;--shiki-dark:#C98A7D77">"</span><span style="--shiki-light:#B56959;--shiki-dark:#C98A7D">i = </span><span style="--shiki-light:#A65E2B;--shiki-dark:#C99076">%d</span><span style="--shiki-light:#B56959;--shiki-dark:#C98A7D">, a = </span><span style="--shiki-light:#A65E2B;--shiki-dark:#C99076">%d</span><span style="--shiki-light:#B56959;--shiki-dark:#C98A7D">, i&#x3C;a: </span><span style="--shiki-light:#A65E2B;--shiki-dark:#C99076">%d\n</span><span style="--shiki-light:#B5695977;--shiki-dark:#C98A7D77">"</span><span style="--shiki-light:#999999;--shiki-dark:#666666">,</span><span style="--shiki-light:#393A34;--shiki-dark:#DBD7CAEE"> i</span><span style="--shiki-light:#999999;--shiki-dark:#666666">,</span><span style="--shiki-light:#393A34;--shiki-dark:#DBD7CAEE"> a</span><span style="--shiki-light:#999999;--shiki-dark:#666666">,</span><span style="--shiki-light:#393A34;--shiki-dark:#DBD7CAEE"> i </span><span style="--shiki-light:#AB5959;--shiki-dark:#CB7676">&#x3C;</span><span style="--shiki-light:#393A34;--shiki-dark:#DBD7CAEE"> a</span><span style="--shiki-light:#999999;--shiki-dark:#666666">);</span></span>
<span class="line"><span style="--shiki-light:#999999;--shiki-dark:#666666">    }</span></span>
<span class="line"><span style="--shiki-light:#999999;--shiki-dark:#666666">}</span></span></code></pre>
<div class="line-numbers" aria-hidden="true" style="counter-reset:line-number 0"><div class="line-number"></div><div class="line-number"></div><div class="line-number"></div><div class="line-number"></div><div class="line-number"></div><div class="line-number"></div><div class="line-number"></div><div class="line-number"></div></div></div><p>当我们调用这个函数，并使用 <code v-pre>g++ -O3</code> 编译运行时发现，这个函数无限循环了下去，并且输出了 <code v-pre>i = 231904, a = 2, i&lt;a: 1</code> 这样的内容，宣称 231904 &lt; 2。</p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-ea564199 data-v-821a1f7d><!----><div class="post-item-content" data-v-821a1f7d><h3 data-v-821a1f7d><!----><!----><!----><a class="vp-link link" href="/2023/07/01/Cloudflare-Tunnel-%E7%9A%84%E4%BD%BF%E7%94%A8%E6%96%B9%E6%B3%95/" data-v-821a1f7d><!--[-->Cloudflare Tunnel 的使用方法<!--]--><!--[--><!--]--><!----></a></h3><div class="post-meta" data-v-821a1f7d><!----><div class="reading-time" data-v-821a1f7d><span class="vpi-books icon" data-v-821a1f7d></span><span data-v-821a1f7d>约 560 字</span><span data-v-821a1f7d>2 分钟</span></div><div class="tag-list" data-v-821a1f7d><span class="icon vpi-tag" data-v-821a1f7d></span><!--[--><a class="vp-link link tag vp-tag-wdj4" href="/tags/?tag=Cloudflare" data-v-821a1f7d><!--[-->Cloudflare<!--]--><!--[--><!--]--><!----></a><!--]--></div><div class="create-time" data-v-821a1f7d><span class="icon vpi-clock" data-v-821a1f7d></span><span data-v-821a1f7d>2023-07-01</span></div></div><div class="vp-doc excerpt" data-v-821a1f7d><p><a href="https://github.com/he0119" target="_blank" rel="noopener noreferrer">日日</a>说不会用 CF Tunnel，就写一篇简单说明一下用法。</p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-ea564199 data-v-821a1f7d><!----><div class="post-item-content" data-v-821a1f7d><h3 data-v-821a1f7d><!----><!----><!----><a class="vp-link link" href="/2023/04/23/Fedora-%E7%B3%BB%E7%BB%9F%E9%83%A8%E7%BD%B2-LXD/" data-v-821a1f7d><!--[-->Fedora 系统部署 LXD<!--]--><!--[--><!--]--><!----></a></h3><div class="post-meta" data-v-821a1f7d><!----><div class="reading-time" data-v-821a1f7d><span class="vpi-books icon" data-v-821a1f7d></span><span data-v-821a1f7d>约 3432 字</span><span data-v-821a1f7d>11 分钟</span></div><div class="tag-list" data-v-821a1f7d><span class="icon vpi-tag" data-v-821a1f7d></span><!--[--><a class="vp-link link tag vp-tag-wdj4" href="/tags/?tag=Fedora" data-v-821a1f7d><!--[-->Fedora<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-88aa" href="/tags/?tag=Linux" data-v-821a1f7d><!--[-->Linux<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-bnzd" href="/tags/?tag=LXD" data-v-821a1f7d><!--[-->LXD<!--]--><!--[--><!--]--><!----></a><!--]--></div><div class="create-time" data-v-821a1f7d><span class="icon vpi-clock" data-v-821a1f7d></span><span data-v-821a1f7d>2023-04-23</span></div></div><div class="vp-doc excerpt" data-v-821a1f7d><p>近来一直想着买台迷你主机，把家里的树莓派换掉，毕竟树莓派性能太低了，连测速都跑不满。要换的话，我可能会选准系统的迷你主机，然后开启一些虚拟机，这样能满足我折腾的需求。我看到比较合适的是 <a href="https://www.proxmox.com/en/proxmox-ve" target="_blank" rel="noopener noreferrer">PVE</a>，但我暂时没有可以安装的机器。另一个看起来比较有趣的技术是 <a href="https://linuxcontainers.org/lxd/introduction/" target="_blank" rel="noopener noreferrer">LXD</a>，看起来可以更充分地利用资源。虽然不知道什么时候能回国（毕竟装系统什么的都很麻烦，恐怕没法远程进行），但是就是想现在看看怎么折腾，就开了一台 Fedora 37 的云服务器，安装了一下试试。</p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-ea564199 data-v-821a1f7d><!----><div class="post-item-content" data-v-821a1f7d><h3 data-v-821a1f7d><!----><!----><!----><a class="vp-link link" href="/2023/02/11/%E4%BD%BF%E7%94%A8-DisplayCAL-%E5%92%8C-Spyder-%E7%BA%A2%E8%93%9D%E8%9C%98%E8%9B%9B%E6%A0%A1%E8%89%B2%E4%BB%AA%E8%BF%9B%E8%A1%8C%E5%B1%8F%E5%B9%95%E6%A0%A1%E8%89%B2%E7%9A%84%E6%B3%A8%E6%84%8F%E4%BA%8B%E9%A1%B9/" data-v-821a1f7d><!--[-->使用 DisplayCAL 和 Spyder 红蓝蜘蛛校色仪进行屏幕校色的注意事项<!--]--><!--[--><!--]--><!----></a></h3><div class="post-meta" data-v-821a1f7d><!----><div class="reading-time" data-v-821a1f7d><span class="vpi-books icon" data-v-821a1f7d></span><span data-v-821a1f7d>约 1285 字</span><span data-v-821a1f7d>4 分钟</span></div><div class="tag-list" data-v-821a1f7d><span class="icon vpi-tag" data-v-821a1f7d></span><!--[--><a class="vp-link link tag vp-tag-tybt" href="/tags/?tag=Spyder" data-v-821a1f7d><!--[-->Spyder<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-rfcv" href="/tags/?tag=校色" data-v-821a1f7d><!--[-->校色<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-iff5" href="/tags/?tag=日常使用" data-v-821a1f7d><!--[-->日常使用<!--]--><!--[--><!--]--><!----></a><!--]--></div><div class="create-time" data-v-821a1f7d><span class="icon vpi-clock" data-v-821a1f7d></span><span data-v-821a1f7d>2023-02-11</span></div></div><div class="vp-doc excerpt" data-v-821a1f7d><p>最近<a href="https://github.com/AkiraXie" target="_blank" rel="noopener noreferrer">药药</a>买了蓝蜘蛛 Spyder X，我告诉他不要用配套软件，直接用 DisplayCAL。DisplayCAL 已经三年多没有更新了，软件不更新也会变质，有些东西直接按当年的步骤，就会出现奇奇怪怪的问题。因此我在此总结一下当前使用 DisplayCAL 和 Spyder X 的完整流程及注意事项。</p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-ea564199 data-v-821a1f7d><!----><div class="post-item-content" data-v-821a1f7d><h3 data-v-821a1f7d><!----><!----><!----><a class="vp-link link" href="/2022/04/29/%E5%B0%86-Btrfs-root-%E5%88%86%E5%8C%BA%E8%BD%AC%E6%8D%A2%E4%B8%BA-subvolume/" data-v-821a1f7d><!--[-->将 Btrfs root 分区转换为 subvolume<!--]--><!--[--><!--]--><!----></a></h3><div class="post-meta" data-v-821a1f7d><!----><div class="reading-time" data-v-821a1f7d><span class="vpi-books icon" data-v-821a1f7d></span><span data-v-821a1f7d>约 831 字</span><span data-v-821a1f7d>3 分钟</span></div><div class="tag-list" data-v-821a1f7d><span class="icon vpi-tag" data-v-821a1f7d></span><!--[--><a class="vp-link link tag vp-tag-wffc" href="/tags/?tag=Btrfs" data-v-821a1f7d><!--[-->Btrfs<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-88aa" href="/tags/?tag=Linux" data-v-821a1f7d><!--[-->Linux<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-bzlg" href="/tags/?tag=Ubuntu" data-v-821a1f7d><!--[-->Ubuntu<!--]--><!--[--><!--]--><!----></a><!--]--></div><div class="create-time" data-v-821a1f7d><span class="icon vpi-clock" data-v-821a1f7d></span><span data-v-821a1f7d>2022-04-29</span></div></div><div class="vp-doc excerpt" data-v-821a1f7d><p>Btrfs 是具有 subvolume、快照等高级功能的写入时复制（copy-on-write）文件系统。Fedora、Ubuntu 桌面版系统在安装到 Btrfs 分区时会为根目录 / 和 home 目录 /home 分别创建不同的 subvolume。但是，Ubuntu Server 默认不会创建任何 subvolume。本文介绍如何将 Btrfs 分区中的根目录转换为 subvolume。</p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-ea564199 data-v-821a1f7d><!----><div class="post-item-content" data-v-821a1f7d><h3 data-v-821a1f7d><!----><!----><!----><a class="vp-link link" href="/2022/03/19/%E7%94%A8-GitHub-Actions-%E5%92%8C-Webhook-%E8%87%AA%E5%8A%A8%E6%9E%84%E5%BB%BA%E5%B9%B6%E9%83%A8%E7%BD%B2-ASP-NET-Core-%E5%BA%94%E7%94%A8/" data-v-821a1f7d><!--[-->用 GitHub Actions 和 Webhook 自动构建并部署 ASP.NET Core 应用<!--]--><!--[--><!--]--><!----></a></h3><div class="post-meta" data-v-821a1f7d><!----><div class="reading-time" data-v-821a1f7d><span class="vpi-books icon" data-v-821a1f7d></span><span data-v-821a1f7d>约 2089 字</span><span data-v-821a1f7d>7 分钟</span></div><div class="tag-list" data-v-821a1f7d><span class="icon vpi-tag" data-v-821a1f7d></span><!--[--><a class="vp-link link tag vp-tag-wdj4" href="/tags/?tag=GitHub" data-v-821a1f7d><!--[-->GitHub<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-wdj4" href="/tags/?tag=Webhook" data-v-821a1f7d><!--[-->Webhook<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-88aa" href="/tags/?tag=Linux" data-v-821a1f7d><!--[-->Linux<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-rfcv" href="/tags/?tag=systemd" data-v-821a1f7d><!--[-->systemd<!--]--><!--[--><!--]--><!----></a><!--]--></div><div class="create-time" data-v-821a1f7d><span class="icon vpi-clock" data-v-821a1f7d></span><span data-v-821a1f7d>2022-03-19</span></div></div><div class="vp-doc excerpt" data-v-821a1f7d><p>最近给自己的直播写了个弹幕后端，基于 ASP.NET Core 和 SignalR，实现非常简单。部署反而比预期麻烦很多，因为我之前自动部署的应用都是静态网站，这次要部署动态应用，就遇到了预料之外的问题。</p>
<p>最终，我选择了用 GitHub Actions 构建并推送到另一分支，然后触发 Webhook，由自己的服务器拉取构建好的新版本并重启应用更新。</p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-ea564199 data-v-821a1f7d><!----><div class="post-item-content" data-v-821a1f7d><h3 data-v-821a1f7d><!----><!----><!----><a class="vp-link link" href="/2022/03/14/%E7%94%A8-Ubuntu-Cloud-Images-%E5%88%B6%E4%BD%9C%E8%87%AA%E5%B7%B1%E7%9A%84%E4%BA%91%E9%95%9C%E5%83%8F%EF%BC%88%E9%85%8D%E7%BD%AE-cloud-init-%E7%9A%84-NoCloud-%E6%95%B0%E6%8D%AE%E6%BA%90%EF%BC%89/" data-v-821a1f7d><!--[-->用 Ubuntu Cloud Images 制作自己的云镜像（配置 cloud-init 的 NoCloud 数据源）<!--]--><!--[--><!--]--><!----></a></h3><div class="post-meta" data-v-821a1f7d><!----><div class="reading-time" data-v-821a1f7d><span class="vpi-books icon" data-v-821a1f7d></span><span data-v-821a1f7d>约 1272 字</span><span data-v-821a1f7d>4 分钟</span></div><div class="tag-list" data-v-821a1f7d><span class="icon vpi-tag" data-v-821a1f7d></span><!--[--><a class="vp-link link tag vp-tag-bzlg" href="/tags/?tag=Ubuntu" data-v-821a1f7d><!--[-->Ubuntu<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-mcyr" href="/tags/?tag=腾讯云" data-v-821a1f7d><!--[-->腾讯云<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-88aa" href="/tags/?tag=Linux" data-v-821a1f7d><!--[-->Linux<!--]--><!--[--><!--]--><!----></a><!--]--></div><div class="create-time" data-v-821a1f7d><span class="icon vpi-clock" data-v-821a1f7d></span><span data-v-821a1f7d>2022-03-14</span></div></div><div class="vp-doc excerpt" data-v-821a1f7d><p>还是之前写过的，云厂商提供的系统镜像不好使的问题。之前写过<VPLink href="/2021/09/24/%E4%BD%BF%E7%94%A8iPXE%E5%92%8Cnetboot-xyz%E9%87%8D%E8%A3%85VPS%E7%B3%BB%E7%BB%9F/">《使用 iPXE 和 netboot.xyz 重装 VPS 系统》</VPLink>，但是，由于各种原因（如系统内存不足、国内网络不稳定等），其适用性受到了限制。这次改用了 Ubuntu Cloud Images，可以直接用 dd 命令覆盖系统盘，然后重装系统。</p>
</div></div></div></template><!--]--><!--[--><!--]--><div class="vp-pagination" data-v-ea564199 data-v-07e4f344><button type="button" class="btn prev" disabled data-v-07e4f344>上一页</button><div class="page-range" data-v-07e4f344><!--[--><button class="active btn" type="button" data-v-07e4f344>1</button><button class="btn" type="button" data-v-07e4f344>2</button><button class="btn" type="button" data-v-07e4f344>3</button><!--]--></div><button type="button" class="btn next" data-v-07e4f344>下一页</button></div><!--[--><!--]--></div><div class="vp-posts-aside" data-v-6699890f data-v-29db040d><!--[--><!--]--><div class="vp-profile" data-v-29db040d data-v-fcd01d10><p class="" data-v-fcd01d10><img src="/钻石头像.png" alt="bleatingsheep" data-v-fcd01d10></p><div class="profile-info" data-v-fcd01d10><h3 data-v-fcd01d10>bleatingsheep</h3><!----><!----><!----></div><!----></div><div class="vp-posts-nav" data-v-29db040d data-v-73b0f6db><a class="vp-link link nav-link" href="/tags/" data-v-73b0f6db><!--[--><span class="icon icon-logo vpi-tag" data-v-73b0f6db></span><span class="text" data-v-73b0f6db>标签</span><span class="total" data-v-73b0f6db>24</span><span class="icon vpi-chevron-right" data-v-73b0f6db></span><!--]--><!--[--><!--]--><!----></a><!----><a class="vp-link link nav-link" href="/archives/" data-v-73b0f6db><!--[--><span class="icon icon-logo vpi-archive" data-v-73b0f6db></span><span class="text" data-v-73b0f6db>归档</span><span class="total" data-v-73b0f6db>25</span><span class="icon vpi-chevron-right" data-v-73b0f6db></span><!--]--><!--[--><!--]--><!----></a></div><!--[--><!--]--></div><!--[--><div class="vp-posts-extract" data-v-9d76dce7><span class="vpi-posts-ext icon" data-v-9d76dce7></span></div><div class="posts-modal" style="display:none;" data-v-9d76dce7><div class="posts-modal-container" data-v-9d76dce7><!--[--><!--]--><div class="profile" data-v-9d76dce7><p class="avatar" data-v-9d76dce7><img src="/钻石头像.png" alt="bleatingsheep" data-v-9d76dce7></p><div data-v-9d76dc
